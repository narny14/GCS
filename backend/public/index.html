
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FastFood One — Restaurant</title>
  <link rel="stylesheet" href="/admin/styles.css">
</head>
<body>
  <header><div><h1>FastFood One</h1><p>Gestion des commandes — retrait au restaurant</p></div><button id="logout" class="secondary hidden">Déconnexion</button></header>
  <main>
    <section id="login-panel" class="panel narrow">
      <h2>Connexion restaurant</h2>
      <form id="login-form">
        <label>E-mail<input type="email" id="email" required autocomplete="username"></label>
        <label>Mot de passe<input type="password" id="password" required autocomplete="current-password"></label>
        <button type="submit">Se connecter</button>
        <p id="login-error" class="error"></p>
      </form>
    </section>
    <section id="app-panel" class="hidden">
      <div class="toolbar panel">
        <div><h2>Commandes</h2><p id="last-refresh">Actualisation automatique toutes les 10 secondes</p></div>
        <button id="refresh">Actualiser</button>
      </div>
      <nav class="tabs"><button id="tab-orders" class="tab active" type="button">Commandes</button><button id="tab-products" class="tab secondary" type="button">Menu & photos</button></nav>
      <section id="orders-panel">
        <div id="summary" class="summary"></div>
        <div id="orders" class="orders"></div>
      </section>
      <section id="products-panel" class="hidden">
        <div class="panel product-editor">
          <h2 id="product-form-title">Ajouter un plat</h2>
          <form id="product-form">
            <input type="hidden" id="product-id">
            <div class="form-grid">
              <label>Nom du plat *<input id="product-name" maxlength="150" required placeholder="Ex. Burger maison"></label>
              <label>Prix *<input id="product-price" type="number" min="0.01" step="0.01" required placeholder="Ex. 8.50"></label>
              <label>Catégorie<input id="product-category" maxlength="80" value="Fast-food" placeholder="Burgers, boissons…"></label>
              <label class="image-field">Photo du plat (JPG, PNG ou WEBP — 5 Mo max.)<input id="product-image" type="file" accept="image/jpeg,image/png,image/webp"><span class="muted">Choisissez une photo sur votre ordinateur ou téléphone.</span></label>
            </div>
            <label>Description<textarea id="product-description" maxlength="2000" rows="3" placeholder="Ingrédients, accompagnement…"></textarea></label>
            <div class="image-preview-wrap"><img id="image-preview" class="image-preview hidden" alt="Aperçu de la photo du plat"><span id="image-placeholder" class="image-placeholder">🍔 Aperçu de la photo</span></div>
            <p id="product-message" class="muted" role="status"></p>
            <div class="form-actions"><button id="save-product" type="submit">Enregistrer le plat</button><button id="cancel-edit" type="button" class="secondary hidden">Annuler la modification</button></div>
          </form>
        </div>
        <h2>Plats enregistrés</h2>
        <div id="products-list" class="products-grid"></div>
      </section>
    </section>
    <audio id="alert-sound" preload="auto">
      <source src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=" type="audio/wav">
    </audio>
    <p id="global-error" class="error"></p>
  </main>
  <script src="/admin/app.js"></script>
</body>
</html>
