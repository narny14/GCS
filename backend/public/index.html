<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#eeeffb">
  <title>FastFood One — Restaurant</title>
  <link rel="stylesheet" href="https://gcs.byteatomeneons.com/admin/styles.css">
  <style>
    :root{--ff-bg:#eef0fb;--ff-card:#fff;--ff-ink:#20202a;--ff-muted:#777987;--ff-yellow:#ffd84d;--ff-yellow-dark:#f0bd19;--ff-border:#ececf3;--ff-shadow:0 12px 35px rgba(53,51,93,.09)}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(ellipse at 50% 0%,#fff 0,#f3f3fc 34%,var(--ff-bg) 100%);color:var(--ff-ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
    body:before{content:"";position:fixed;width:260px;height:260px;border-radius:50%;background:#dfe2f8;filter:blur(2px);opacity:.55;top:120px;right:-100px;z-index:-1}
    header{max-width:1180px;margin:0 auto;padding:28px 24px 18px;display:flex;align-items:center;justify-content:space-between;gap:18px}
    header h1{margin:0;font-size:clamp(1.6rem,3vw,2.2rem);letter-spacing:-.06em;font-weight:850}
    header p{margin:5px 0 0;color:var(--ff-muted);font-size:.92rem}
    main{max-width:1180px;margin:0 auto;padding:12px 24px 56px}
    h2{letter-spacing:-.04em}
    .panel,.order,.product-card{background:var(--ff-card)!important;border:1px solid rgba(255,255,255,.9)!important;border-radius:24px!important;box-shadow:var(--ff-shadow)!important}
    .panel{padding:clamp(18px,3vw,28px)!important}
    .narrow{max-width:430px;margin:45px auto}
    label{display:block;font-weight:650;font-size:.9rem;margin:14px 0;color:#373744}
    input,textarea,select{display:block;width:100%;margin-top:8px;border:1px solid #e5e5ef!important;border-radius:14px!important;background:#fbfbfe!important;padding:13px 14px!important;color:var(--ff-ink);font:inherit;outline:none;transition:border-color .18s,box-shadow .18s}
    input:focus,textarea:focus,select:focus{border-color:#e8c43d!important;box-shadow:0 0 0 4px rgba(255,216,77,.2)}
    button{border:0!important;border-radius:999px!important;background:var(--ff-yellow)!important;color:#292718!important;font-weight:750!important;padding:12px 18px!important;cursor:pointer;box-shadow:0 5px 12px rgba(238,190,35,.16);transition:transform .16s,filter .16s}
    button:hover{filter:brightness(.98);transform:translateY(-1px)}
    button:disabled{opacity:.55;cursor:wait}
    button.secondary,.tab.secondary{background:#f1f1f8!important;color:#454553!important;box-shadow:none}
    button.danger{background:#ffe8e8!important;color:#a12d36!important}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px}
    .toolbar h2{margin:0;font-size:1.45rem}
    .toolbar p{margin:6px 0 0;color:var(--ff-muted);font-size:.84rem}
    .tabs{display:flex;gap:10px;margin:18px 0 24px;padding:6px;background:rgba(255,255,255,.65);border:1px solid #fff;border-radius:999px;width:max-content;max-width:100%}
    .tabs button{box-shadow:none}
    .summary{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px}
    .pill{display:inline-flex;gap:6px;align-items:center;background:#fff;border:1px solid var(--ff-border);padding:10px 14px;border-radius:999px;font-size:.84rem;color:#666879;box-shadow:0 4px 14px rgba(40,40,80,.04)}
    .orders{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
    .order{padding:20px!important;min-width:0}
    .order h3,.product-card h3{margin:0 0 10px;font-size:1.08rem;letter-spacing:-.025em;overflow-wrap:anywhere}
    .status{display:inline-flex;background:#fff3c2;color:#79600b;padding:6px 11px;border-radius:999px;font-size:.78rem;font-weight:800;margin-bottom:10px}
    .order.accepted .status{background:#e7f4e9;color:#286a3b}.order.preparing .status{background:#e8edff;color:#3b4fa3}.order.ready .status{background:#fff0d6;color:#8d5a08}.order.cancelled .status{background:#ffe8e8;color:#a12d36}
    .order p{line-height:1.55;font-size:.91rem;overflow-wrap:anywhere}
    .items{padding-left:20px;color:#545565;line-height:1.7}
    .order-footer,.actions,.product-actions,.product-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
    .actions button,.product-actions button{font-size:.8rem;padding:9px 12px!important}
    .muted{color:var(--ff-muted)!important;font-size:.85rem}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px}
    .image-field{grid-column:1/-1}
    .image-preview-wrap{display:flex;align-items:center;justify-content:center;min-height:140px;margin:18px 0;padding:14px;border:1px dashed #d9d9e9;border-radius:18px;background:#fafaff}
    .image-preview{max-width:100%;max-height:240px;object-fit:contain;border-radius:16px}
    .image-placeholder{color:#85869a}
    .form-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
    .products-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:18px;margin-top:18px}
    .product-card{overflow:hidden}
    .product-card-image,.product-card-placeholder{width:100%;height:190px;object-fit:cover;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#fff9df,#f0f0fb);font-size:3rem}
    .product-card-content{padding:18px}
    .product-card-content p{line-height:1.5}
    .product-card-content>strong{display:block;font-size:1.15rem;margin:12px 0}
    .availability{font-size:.72rem;font-weight:800;border-radius:999px;padding:6px 9px;white-space:nowrap}
    .availability.available{background:#e6f7eb;color:#267344}.availability.unavailable{background:#f0f0f5;color:#6b6b7b}
    .empty{background:#fff;border-radius:20px;padding:28px;text-align:center;color:var(--ff-muted);box-shadow:var(--ff-shadow)}
    .error{color:#b42332}
    .hidden{display:none!important}
    #global-error{margin-top:18px}
    @media(max-width:640px){header{padding:22px 16px 12px;align-items:flex-start}header p{max-width:230px;line-height:1.4}main{padding:10px 14px 38px}.toolbar{align-items:flex-start;flex-direction:column}.toolbar #refresh{width:100%}.tabs{width:100%}.tabs button{flex:1;padding:11px 10px!important}.form-grid{grid-template-columns:1fr}.image-field{grid-column:auto}.narrow{margin:25px auto}.order{padding:17px!important}.product-card-image,.product-card-placeholder{height:170px}}
  </style>
</head>
<body>
  <header>
    <div><h1>FastFood One</h1><p>Gestion des commandes — retrait au restaurant</p></div>
    <button id="logout" class="secondary hidden" type="button">Déconnexion</button>
  </header>
  <main>
    <section id="login-panel" class="panel narrow">
      <h2>Connexion restaurant</h2>
      <form id="login-form">
        <label>E-mail<input type="email" id="email" required autocomplete="username"></label>
        <label>Mot de passe<input type="password" id="password" required autocomplete="current-password"></label>
        <button type="submit">Se connecter</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </section>
    <section id="app-panel" class="hidden">
      <div class="toolbar panel">
        <div><h2>Commandes</h2><p id="last-refresh">Actualisation automatique toutes les 10 secondes</p></div>
        <button id="refresh" type="button">Actualiser</button>
      </div>
      <nav class="tabs">
        <button id="tab-orders" class="tab active" type="button">Commandes</button>
        <button id="tab-products" class="tab secondary" type="button">Menu &amp; photos</button>
      </nav>
      <section id="orders-panel"><div id="summary" class="summary"></div><div id="orders" class="orders"></div></section>
      <section id="products-panel" class="hidden">
        <div class="panel product-editor">
          <h2 id="product-form-title">Ajouter un plat</h2>
          <form id="product-form">
            <input type="hidden" id="product-id">
            <div class="form-grid">
              <label>Nom du plat *<input id="product-name" maxlength="150" required placeholder="Ex. Burger maison"></label>
              <label>Prix *<input id="product-price" type="number" min="0.01" step="0.01" required placeholder="Ex. 8.50"></label>
              <label>Catégorie du plat *
                <select id="product-category" required>
                  <option value="Pizza">Pizza</option><option value="Burger">Burger</option><option value="Frites">Frites</option><option value="Drink">Drink</option><option value="Poulet">Poulet</option><option value="Porcs">Porcs</option><option value="Poissons">Poissons</option><option value="Legumes">Legumes</option><option value="Chevres">Chevres</option><option value="Vaches">Vaches</option><option value="Lapins">Lapins</option><option value="Dindons">Dindons</option><option value="Gibiers">Gibiers</option>
                </select>
              </label>
              <label class="image-field">Photo du plat (JPG, PNG ou WEBP — 5 Mo max.)
                <input id="product-image" type="file" accept="image/jpeg,image/png,image/webp">
                <span class="muted">Choisissez une photo sur votre ordinateur ou téléphone.</span>
              </label>
            </div>
            <label>Description<textarea id="product-description" maxlength="2000" rows="3" placeholder="Ingrédients, accompagnement…"></textarea></label>
            <div class="image-preview-wrap"><img id="image-preview" class="image-preview hidden" alt="Aperçu de la photo du plat"><span id="image-placeholder" class="image-placeholder">🍕 Aperçu de la photo</span></div>
            <p id="product-message" class="muted" role="status"></p>
            <div class="form-actions"><button id="save-product" type="submit">Enregistrer le plat</button><button id="cancel-edit" type="button" class="secondary hidden">Annuler la modification</button></div>
          </form>
        </div>
        <h2 style="margin-top:28px">Plats enregistrés</h2><div id="products-list" class="products-grid"></div>
      </section>
    </section>
    <p id="global-error" class="error" role="alert"></p>
  </main>
  <script src="https://gcs.byteatomeneons.com/admin/app.js" defer></script>
</body>
</html>
